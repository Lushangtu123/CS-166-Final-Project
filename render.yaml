services:
  - type: web
    name: phishguard-cs166-demo
    runtime: python
    plan: free
    buildCommand: pip install -r website/requirements.txt
    startCommand: cd website && uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: PHISHGUARD_DEPLOYMENT_PROFILE
        value: free-demo
      - key: APP_ENV
        value: demo
      - key: ENABLE_EMAIL_VERIFICATION
        value: "false"
      - key: CONTENT_MODEL_ENABLED
        value: "false"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: RATE_LIMIT_BUCKET_CAPACITY
        value: "4096"
      - key: MAX_REQUEST_BYTES
        value: "65536"
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
