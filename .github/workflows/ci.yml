name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r website/requirements.txt

      - name: Run backend tests
        run: python -m unittest discover -s website/tests -v

      - name: Check Python syntax
        run: python -m compileall -q website phishing-detection/src

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run frontend tests
        run: node --test website/static/app.test.mjs

      - name: Check JavaScript syntax
        run: node --check website/static/app.js
