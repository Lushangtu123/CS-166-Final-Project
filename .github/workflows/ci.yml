name: CI

on:
  push:
  pull_request:

jobs:
  vercel-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Vercel runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Smoke-test committed Vercel profile and model
        run: python website/tests/vercel_runtime_smoke.py

      - name: Evaluate fixed synthetic controls against committed baseline
        run: |
          python website/tools/evaluate_public_corpus.py --manifest website/tests/fixtures/evaluation/manifest.json --output /tmp/evaluation-candidate.json
          python website/tools/compare_evaluations.py --baseline website/tests/fixtures/evaluation/baseline.json --candidate /tmp/evaluation-candidate.json

      - name: Check Vercel dependency consistency
        run: python -m pip check

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r website/requirements.txt

      - name: Run backend tests
        env:
          PHISHGUARD_TEST_REDIS_PORT: "6379"
        run: python -m unittest discover -s website/tests -v

      - name: Test localhost evaluation server boundaries
        run: python website/tools/vision-benchmark/test_server.py

      - name: Check Python syntax
        run: python -m compileall -q website phishing-detection/src

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify pinned recognition assets
        run: node website/tools/vision-assets/verify.mjs

      - name: Run frontend tests
        run: node --test website/static/*.test.mjs

      - name: Check JavaScript syntax
        run: |
          node --check website/static/app.js
          node --check website/static/cases.js
          node --check website/static/cases-theme.js
          node --check website/static/vision.js
          node --check website/static/file-intake.js
          node --check website/static/vision-core.mjs
          node --check website/static/vision-email.mjs
          node --check website/static/vision-worker.mjs
          node --check website/tools/vision-benchmark/harness.mjs
          node --check website/tools/vision-benchmark/metrics.mjs
