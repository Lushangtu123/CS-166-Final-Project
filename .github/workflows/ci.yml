name: CI

on:
  push:
  pull_request:

jobs:
  vercel-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Vercel runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Smoke-test committed Vercel profile and model
        run: python website/tests/vercel_runtime_smoke.py

      - name: Check Vercel dependency consistency
        run: python -m pip check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r website/requirements.txt

      - name: Run backend tests
        run: python -m unittest discover -s website/tests -v

      - name: Check Python syntax
        run: python -m compileall -q website phishing-detection/src

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run frontend tests
        run: node --test website/static/*.test.mjs

      - name: Check JavaScript syntax
        run: |
          node --check website/static/app.js
          node --check website/static/cases.js
