name: Post-deploy smoke

on:
  deployment_status:

permissions:
  contents: read

jobs:
  production-smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check deployed model and positive-control prediction
        env:
          # Vercel's immutable deployment URL is protected by SSO. The public
          # production alias is verified against the deployed commit's model SHA.
          DEPLOYMENT_URL: https://phishguard-email-analyzer.vercel.app
        run: >-
          python website/tools/post_deploy_smoke.py
          --base-url "$DEPLOYMENT_URL"
          --require-sender-history
